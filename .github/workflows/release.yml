name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Verify the BOM + every SDK module + the maven plugin. Sample app is
      # deliberately excluded (it's the internal validation harness, marked
      # maven.deploy.skip in its pom).
      - name: Verify
        run: ./mvnw -B -pl '!allstak-sample-app' verify

      # Deploy every artefact except the sample app to Maven Central.
      # central-publishing-maven-plugin (release profile in the parent pom)
      # signs, uploads, then blocks until Sonatype validates the bundle.
      - name: Deploy
        run: ./mvnw -B -pl '!allstak-sample-app' -DskipTests -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # If the GPG key was generated without a passphrase the env var
          # below is simply empty; setup-java's gpg-passphrase is still
          # supplied so the maven-gpg-plugin reads it without prompting.
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

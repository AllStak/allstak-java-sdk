server.port=8090

# AllStak SDK Configuration
# Set ALLSTAK_API_KEY in your environment before running.
allstak.api-key=${ALLSTAK_API_KEY:}
allstak.environment=${ALLSTAK_ENVIRONMENT:development}
allstak.release=${ALLSTAK_RELEASE:local}
allstak.debug=true
allstak.service-name=allstak-sample-app
allstak.flush-interval-ms=2000
allstak.buffer-size=100
allstak.capture-http-requests=true
allstak.capture-exceptions=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:ordersdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
allstak.host=${ALLSTAK_HOST:https://api.allstak.sa}
